[Service]
Environment=ENABLE_LIBCAMERA_PATH=true

# Render at the size agl-compositor maximizes app surfaces to on this
# board, so the letterbox bars the 4:3 sensor leaves are part of the
# frame itself and the logo overlay lands in them. Without this the app
# renders at its 640x720 default and waylandsink adds the bars after the
# overlay has already been composited, putting the logo over the picture.
# A mismatch here is not fatal: waylandsink still scales to fit.
Environment=DEFAULT_DEVICE_WIDTH=1080
Environment=DEFAULT_DEVICE_HEIGHT=1712
